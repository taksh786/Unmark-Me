<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unmark Me</title>
  <meta name="description" content="Unmark Me removes Gemini watermarks from images and videos, right in your browser.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Cpath d='M16 7.5l-2 6.5-6.5 2 6.5 2 2 6.5 2-6.5 6.5-2-6.5-2z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --fill: rgba(120, 120, 128, 0.12);
      --fill-hover: rgba(120, 120, 128, 0.18);
      --label: #1d1d1f;
      --label-2: #6e6e73;
      --label-3: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.07);
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #161617;
        --fill: rgba(120, 120, 128, 0.24);
        --fill-hover: rgba(120, 120, 128, 0.32);
        --label: #f5f5f7;
        --label-2: #a1a1a6;
        --accent: #0a84ff;
        --accent-hover: #2b95ff;
        --shadow: 0 0 0 1px rgba(255, 255, 255, 0.07), 0 12px 32px rgba(0, 0, 0, 0.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--label);
      line-height: 1.47;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 640px; text-align: center; }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--label);
      color: var(--bg);
      box-shadow: var(--shadow);
    }
    .mark svg { width: 34px; height: 34px; fill: currentColor; }
    h1 {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      font-size: clamp(2.5rem, 7vw, 3.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }
    p {
      max-width: 30rem;
      margin: 16px auto 0;
      font-size: clamp(1.0625rem, 2.4vw, 1.25rem);
      line-height: 1.42;
      color: var(--label-2);
    }
    .actions {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .button {
      height: 44px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      border-radius: 980px;
      font-size: 1.0625rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 120ms var(--ease), transform 120ms var(--ease);
    }
    .button:active { transform: scale(0.97); }
    .button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-hover); }
    .secondary { background: var(--fill); color: var(--label); }
    .secondary:hover { background: var(--fill-hover); }
    .notes {
      margin-top: 48px;
      font-size: 0.8125rem;
      line-height: 1.7;
      color: var(--label-3);
    }
    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l-1.7 5.3-5.3 1.7 5.3 1.7 1.7 5.3 1.7-5.3 5.3-1.7-5.3-1.7z"/></svg>
    </div>
    <h1>Unmark Me</h1>
    <p>Remove Gemini watermarks from images and videos. Everything runs in your browser, so your files never leave your device.</p>

    <div class="actions">
      <a class="button primary" href="./dev-preview.html">Open Unmark Me</a>
      <a class="button secondary" href="userscript/gemini-watermark-remover.user.js" target="_blank">Install userscript</a>
    </div>

    <div class="notes">
      <div>The userscript removes watermarks automatically on the Gemini website.</div>
    </div>
  </main>
</body>
</html>
